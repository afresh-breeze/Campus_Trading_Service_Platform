<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrow-right" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="0">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
    <marker id="arrow-left" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="180">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
    <marker id="arrow-start-left" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="180">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="580" fill="#F4F1E7"/>

  <text x="40" y="58" font-size="30" font-weight="700" fill="#3D2B1F">校园交易服务平台 · 数据流图（顶层图）</text>
  <text x="40" y="86" font-size="13" fill="#806E5C">用户 ↔ 校园服务平台 ↔ 数据库　|　数据流图</text>
  <line x1="40" y1="98" x2="700" y2="98" stroke="#E6A874" stroke-width="2"/>
  <text x="40" y="126" font-size="13" fill="#806E5C">矩形 = 外部实体　圆形 = 加工　棕色矩形 = 数据存储　箭头 = 数据流</text>
  <text x="40" y="147" font-size="13" fill="#806E5C">↔ = 双向数据流　顶层图只界定系统边界，内部加工见 0 层图</text>

  <rect x="60" y="280" width="180" height="80" rx="2" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="150" y="308" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1f2937">用户</text>
  <text x="150" y="334" text-anchor="middle" dominant-baseline="middle" font-size="12.5" fill="#64748b">买家 / 卖家 / 跑腿</text>

  <circle cx="600" cy="320" r="100" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="600" y="296" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#0284c7">系统</text>
  <text x="600" y="322" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700" fill="#0f172a">校园交易</text>
  <text x="600" y="346" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700" fill="#0f172a">服务平台</text>

  <rect x="860" y="280" width="200" height="80" fill="#FFF8EE"/>
  <path d="M860,280 H1060 V360 H860 V280" fill="none" stroke="#C9A87C" stroke-width="1.8"/>
  <text x="960" y="310" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#5D4630">数据库</text>
  <text x="960" y="336" text-anchor="middle" dominant-baseline="middle" font-size="12.5" fill="#806E5C">持久化数据</text>

  <line x1="242" y1="300" x2="500" y2="300" stroke="#4B5563" stroke-width="1.4" marker-end="url(#arrow-right)"/>
  <text x="371" y="288" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5D4630" stroke="#ffffff" stroke-width="4" paint-order="stroke">商品 / 代取 / 聊天数据</text>

  <line x1="500" y1="340" x2="242" y2="340" stroke="#4B5563" stroke-width="1.4" marker-end="url(#arrow-left)"/>
  <text x="371" y="358" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5D4630" stroke="#ffffff" stroke-width="4" paint-order="stroke">列表 / 状态 / 消息结果</text>

  <line x1="702" y1="320" x2="858" y2="320" stroke="#4B5563" stroke-width="1.4" marker-start="url(#arrow-start-left)" marker-end="url(#arrow-right)"/>
  <text x="780" y="306" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5D4630" stroke="#ffffff" stroke-width="4" paint-order="stroke">业务数据（读 / 写）</text>

  <text x="40" y="500" font-size="12" fill="#806E5C">注：顶层图把系统视为一个加工，只保留外部实体、系统加工与数据存储，用于界定系统边界。</text>
  <text x="40" y="522" font-size="12" fill="#806E5C">用户发出的商品、代取、聊天请求经平台处理后返回结果；平台与数据库之间为业务数据的读写。</text>
</svg>
