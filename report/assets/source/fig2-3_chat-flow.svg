<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1400" viewBox="0 0 1120 1400" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrow-right" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="0">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="90">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
    <marker id="arrow-left" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="180">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="1400" fill="#F4F1E7"/>

  <text x="40" y="58" font-size="30" font-weight="700" fill="#3D2B1F">校园交易服务平台 · 聊天流程图</text>
  <text x="40" y="86" font-size="13" fill="#806E5C">发起会话 · 轮询拉消息 · 标记已读　|　聊天</text>
  <line x1="40" y1="98" x2="640" y2="98" stroke="#E6A874" stroke-width="2"/>
  <text x="40" y="126" font-size="13" fill="#806E5C">胶囊 = 开始 / 结束　灰色矩形 = 操作步骤　紫色菱形 = 判断</text>
  <text x="40" y="147" font-size="13" fill="#806E5C">轮询间隔 3 秒　afterId = 本地最大 messageId　is_read = 消息已读标记</text>

  <rect x="380" y="178" width="160" height="44" rx="22" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="460" y="200" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1f2937">开始</text>

  <line x1="460" y1="222" x2="460" y2="266" stroke="#4B5563" stroke-width="1.4" marker-end="url(#arrow-down)"/>

  <rect x="340" y="268" width="240" height="64" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="460" y="292" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1f2937">选择联系入口</text>
  <text x="460" y="316" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#64748b">商品详情 / 代取详情 / 找跑腿</text>

  <line x1="460" y1="332" x2="460" y2="372" stroke="#4B5563" stroke-width="1.4" marker-end="url(#arrow-down)"/>

  <rect x="340" y="374" width="240" height="64" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="460" y="398" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1f2937">获取或创建会话</text>
  <text x="460" y="422" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#64748b">同一对方 + 业务复用</text>

  <line x1="460" y1="438" x2="460" y2="478" stroke="#4B5563" stroke-width="1.4" marker-end="url(#arrow-down)"/>

  <rect x="340" y="480" width="240" height="64" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="460" y="504" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1f2937">进入聊天页</text>
  <text x="460" y="528" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#64748b">顶部业务卡片 + 最近消息</text>

  <line x1="460" y1="544" x2="460" y2="588" stroke="#4B5563" stroke-width="1.4" marker-end="url(#arrow-down)"/>

  <rect x="340" y="590" width="240" height="64" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="460" y="614" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1f2937">轮询新消息</text>
  <text x="460" y="638" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#64748b">每 3 秒 · afterId 增量</text>

  <line x1="460" y1="654" x2="460" y2="694" stroke="#4B5563" stroke-width="1.4" marker-end="url(#arrow-down)"/>

  <polygon points="460,696 570,752 460,808 350,752" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="460" y="752" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="700" fill="#0f172a">有新消息？</text>

  <line x1="570" y1="752" x2="758" y2="752" stroke="#4B5563" stroke-width="1.4" marker-end="url(#arrow-right)"/>
  <text x="600" y="740" font-size="13" font-weight="700" fill="#5D4630" stroke="#ffffff" stroke-width="4" paint-order="stroke">是</text>

  <rect x="760" y="720" width="220" height="64" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="870" y="744" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1f2937">追加消息并标记已读</text>
  <text x="870" y="768" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#64748b">PUT /read · lastMessageId</text>

  <path d="M870,720 V622" fill="none" stroke="#4B5563" stroke-width="1.4"/>
  <path d="M1010,622 H582" fill="none" stroke="#4B5563" stroke-width="1.4" marker-end="url(#arrow-left)"/>
  <circle cx="870" cy="622" r="3" fill="#4B5563"/>
  <text x="700" y="612" font-size="13" font-weight="700" fill="#5D4630" stroke="#ffffff" stroke-width="4" paint-order="stroke">继续轮询</text>

  <line x1="460" y1="808" x2="460" y2="848" stroke="#4B5563" stroke-width="1.4" marker-end="url(#arrow-down)"/>
  <text x="472" y="828" font-size="13" font-weight="700" fill="#5D4630" stroke="#ffffff" stroke-width="4" paint-order="stroke">否</text>

  <polygon points="460,850 560,906 460,962 360,906" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="460" y="906" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="700" fill="#0f172a">是否发送消息？</text>

  <line x1="360" y1="906" x2="282" y2="906" stroke="#4B5563" stroke-width="1.4" marker-end="url(#arrow-left)"/>
  <text x="320" y="894" font-size="13" font-weight="700" fill="#5D4630" stroke="#ffffff" stroke-width="4" paint-order="stroke">是</text>

  <rect x="60" y="874" width="220" height="64" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="170" y="898" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1f2937">发送文本 / 图片</text>
  <text x="170" y="922" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#64748b">图片先上传 /api/upload</text>

  <path d="M170,874 V622 H338" fill="none" stroke="#4B5563" stroke-width="1.4" marker-end="url(#arrow-right)"/>

  <line x1="460" y1="962" x2="460" y2="1002" stroke="#4B5563" stroke-width="1.4" marker-end="url(#arrow-down)"/>
  <text x="472" y="982" font-size="13" font-weight="700" fill="#5D4630" stroke="#ffffff" stroke-width="4" paint-order="stroke">否</text>

  <polygon points="460,1004 560,1060 460,1116 360,1060" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="460" y="1060" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="700" fill="#0f172a">离开聊天页？</text>

  <line x1="460" y1="1116" x2="460" y2="1156" stroke="#4B5563" stroke-width="1.4" marker-end="url(#arrow-down)"/>
  <text x="472" y="1136" font-size="13" font-weight="700" fill="#5D4630" stroke="#ffffff" stroke-width="4" paint-order="stroke">是</text>

  <path d="M560,1060 H1010 V622" fill="none" stroke="#4B5563" stroke-width="1.4"/>
  <text x="700" y="1050" font-size="13" font-weight="700" fill="#5D4630" stroke="#ffffff" stroke-width="4" paint-order="stroke">否，继续聊天</text>

  <rect x="340" y="1158" width="240" height="64" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="460" y="1182" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1f2937">停止轮询</text>
  <text x="460" y="1206" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#64748b">清除定时器，保留会话</text>

  <line x1="460" y1="1222" x2="460" y2="1238" stroke="#4B5563" stroke-width="1.4" marker-end="url(#arrow-down)"/>

  <rect x="380" y="1240" width="160" height="44" rx="22" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="460" y="1262" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1f2937">结束</text>

  <text x="40" y="1340" font-size="12" fill="#806E5C">注：轮询只拉 afterId 之后的新消息；进入会话后按 lastMessageId 标记已读；发送失败保留草稿可重发，不做本地假消息。</text>
  <text x="40" y="1362" font-size="12" fill="#806E5C">会话按「双方用户 + 业务类型 + 业务 ID」复用；找跑腿必须先创建私单，bizId=私单 orderId；图片消息只存 /uploads/ 相对路径。</text>
</svg>
