<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1500" viewBox="0 0 1120 1500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrow-right" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="0">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="90">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
    <marker id="arrow-left" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="180">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="1500" fill="#F4F1E7"/>

  <text x="40" y="58" font-size="30" font-weight="700" fill="#3D2B1F">校园交易服务平台 · 上线与接单设置流程图</text>
  <text x="40" y="86" font-size="13" fill="#806E5C">接单设置 · 在线计划 · 自动 / 手动上下线　|　跑腿</text>
  <line x1="40" y1="98" x2="660" y2="98" stroke="#E6A874" stroke-width="2"/>
  <text x="40" y="126" font-size="13" fill="#806E5C">胶囊 = 开始 / 结束　灰色矩形 = 操作步骤　紫色菱形 = 判断　虚线框 = 规则提醒</text>
  <text x="40" y="147" font-size="13" fill="#806E5C">slot = 按计划自动上下线　now = 现在上线手动保持　manual_until = 手动覆盖截止时间</text>

  <rect x="380" y="178" width="160" height="44" rx="22" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="460" y="200" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1f2937">开始</text>

  <line x1="460" y1="222" x2="460" y2="266" stroke="#4B5563" stroke-width="1.4" marker-end="url(#arrow-down)"/>

  <rect x="340" y="268" width="240" height="64" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="460" y="292" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1f2937">进入接单设置页</text>
  <text x="460" y="316" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#64748b">个人中心 / 代取大厅 双入口</text>

  <line x1="460" y1="332" x2="460" y2="372" stroke="#4B5563" stroke-width="1.4" marker-end="url(#arrow-down)"/>

  <rect x="340" y="374" width="240" height="64" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="460" y="398" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1f2937">读取上次接单设置</text>
  <text x="460" y="422" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#64748b">GET runner-profile 回填</text>

  <line x1="460" y1="438" x2="460" y2="478" stroke="#4B5563" stroke-width="1.4" marker-end="url(#arrow-down)"/>

  <rect x="340" y="480" width="240" height="64" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="460" y="504" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1f2937">编辑接单资料</text>
  <text x="460" y="528" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#64748b">片区 / 规格 / 报价 / 备注</text>

  <line x1="460" y1="544" x2="460" y2="584" stroke="#4B5563" stroke-width="1.4" marker-end="url(#arrow-down)"/>

  <polygon points="460,586 570,642 460,698 350,642" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="460" y="642" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="700" fill="#0f172a">是否按计划上线？</text>

  <line x1="570" y1="642" x2="758" y2="642" stroke="#4B5563" stroke-width="1.4" marker-end="url(#arrow-right)"/>
  <text x="600" y="630" font-size="13" font-weight="700" fill="#5D4630" stroke="#ffffff" stroke-width="4" paint-order="stroke">否，现在上线</text>

  <rect x="760" y="610" width="220" height="64" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="870" y="634" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1f2937">保存为现在上线</text>
  <text x="870" y="658" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#64748b">PUT runner-profile · now</text>

  <line x1="870" y1="674" x2="870" y2="714" stroke="#4B5563" stroke-width="1.4" marker-end="url(#arrow-down)"/>

  <rect x="760" y="716" width="220" height="64" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="870" y="740" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1f2937">手动上线 / 下线</text>
  <text x="870" y="764" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#64748b">手动保持 · 不自动切换</text>

  <line x1="460" y1="698" x2="460" y2="738" stroke="#4B5563" stroke-width="1.4" marker-end="url(#arrow-down)"/>
  <text x="474" y="720" font-size="13" font-weight="700" fill="#5D4630" stroke="#ffffff" stroke-width="4" paint-order="stroke">是，按计划</text>

  <rect x="340" y="740" width="240" height="64" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="460" y="764" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1f2937">编辑在线计划列表</text>
  <text x="460" y="788" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#64748b">once 具体日期 / weekly 循环</text>

  <rect x="60" y="726" width="220" height="92" rx="4" fill="#FFF8EE" stroke="#C9A87C" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="170" y="752" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="700" fill="#5D4630">修改进行中的循环</text>
  <text x="170" y="776" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#806E5C">只影响下一次</text>
  <text x="170" y="798" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#806E5C">保存前弹窗提醒用户</text>
  <line x1="340" y1="772" x2="284" y2="772" stroke="#C9A87C" stroke-width="1.2" stroke-dasharray="4 4"/>

  <line x1="460" y1="804" x2="460" y2="844" stroke="#4B5563" stroke-width="1.4" marker-end="url(#arrow-down)"/>

  <rect x="340" y="846" width="240" height="64" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="460" y="870" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1f2937">保存接单设置</text>
  <text x="460" y="894" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#64748b">校验重叠 · 至少 1 条未来计划</text>

  <line x1="460" y1="910" x2="460" y2="950" stroke="#4B5563" stroke-width="1.4" marker-end="url(#arrow-down)"/>

  <rect x="340" y="952" width="240" height="64" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="460" y="976" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1f2937">系统按计划自动上下线</text>
  <text x="460" y="1000" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#64748b">每分钟扫描 · 计划边界生效</text>

  <line x1="460" y1="1016" x2="460" y2="1056" stroke="#4B5563" stroke-width="1.4" marker-end="url(#arrow-down)"/>

  <polygon points="460,1058 570,1114 460,1170 350,1114" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="460" y="1114" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="700" fill="#0f172a">是否手动覆盖？</text>

  <line x1="460" y1="1170" x2="460" y2="1208" stroke="#4B5563" stroke-width="1.4" marker-end="url(#arrow-down)"/>
  <text x="472" y="1190" font-size="13" font-weight="700" fill="#5D4630" stroke="#ffffff" stroke-width="4" paint-order="stroke">是</text>

  <rect x="340" y="1210" width="240" height="80" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="460" y="1234" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1f2937">手动上线 / 下线</text>
  <text x="460" y="1256" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#64748b">now 保持 · slot 写 manual_until</text>
  <text x="460" y="1276" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#64748b">下一计划边界 / 当天 23:59</text>

  <rect x="60" y="1190" width="220" height="100" rx="4" fill="#FFF8EE" stroke="#C9A87C" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="170" y="1216" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="700" fill="#5D4630">下线进行中的循环</text>
  <text x="170" y="1242" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#806E5C">弹窗：只这一次</text>
  <text x="170" y="1264" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#806E5C">/ 取消之后所有</text>
  <line x1="340" y1="1250" x2="284" y2="1250" stroke="#C9A87C" stroke-width="1.2" stroke-dasharray="4 4"/>

  <line x1="570" y1="1114" x2="758" y2="1114" stroke="#4B5563" stroke-width="1.4" marker-end="url(#arrow-right)"/>
  <text x="600" y="1102" font-size="13" font-weight="700" fill="#5D4630" stroke="#ffffff" stroke-width="4" paint-order="stroke">否</text>

  <rect x="760" y="1082" width="220" height="64" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="870" y="1106" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1f2937">到点自动切换</text>
  <text x="870" y="1130" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#64748b">按计划边界自动上下线</text>

  <path d="M980,748 H1050 V1310 H460" fill="none" stroke="#4B5563" stroke-width="1.4"/>
  <path d="M980,1114 H1050" fill="none" stroke="#4B5563" stroke-width="1.4"/>
  <circle cx="1050" cy="1114" r="3" fill="#4B5563"/>
  <circle cx="460" cy="1310" r="3" fill="#4B5563"/>

  <line x1="460" y1="1290" x2="460" y2="1330" stroke="#4B5563" stroke-width="1.4" marker-end="url(#arrow-down)"/>

  <rect x="380" y="1330" width="160" height="44" rx="22" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="460" y="1352" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1f2937">结束</text>

  <text x="40" y="1428" font-size="12" fill="#806E5C">注：两个入口共用同一表单，进入时回填上次设置；片区至少选 1 个，地标必须在所选片区内，规格、报价、备注可选。</text>
  <text x="40" y="1450" font-size="12" fill="#806E5C">slot 模式至少保留 1 条未来计划，同一时间的两条计划不能重叠；保存后立即重算 is_online，之后每分钟扫描计划边界自动上下线。</text>
  <text x="40" y="1472" font-size="12" fill="#806E5C">修改进行中的 weekly 只影响下一次；手动操作写 manual_until，到下一计划边界或当天 23:59 恢复；循环下线弹窗选「只这一次 / 取消之后所有」，后者删除规则、无计划时切回 now。</text>
</svg>
